# MMBench Validation Configuration

benchmark: MMBench-2024
version: 0.1.0

## Metrics

| Metric | Description | Weight |
|--------|-------------|--------|
| AE | Analysis Evaluation - Problem understanding depth | 25% |
| MR | Modeling Rigor - Mathematical formulation quality | 25% |
| PS | Practicality/Scientificity - Solution applicability | 25% |
| RBA | Result/Bias Analysis - Output validation | 25% |

## Evaluation Criteria

### AE (Analysis Evaluation)
- Problem objective identification accuracy
- Assumption discovery completeness
- Interdependency analysis depth
- Alternative perspective coverage

### MR (Modeling Rigor)
- Method selection appropriateness
- Formula correctness and completeness
- Variable definition clarity
- Mathematical derivation soundness

### PS (Practicality/Scientificity)
- Solution real-world applicability
- Implementation feasibility
- Scientific rigor in approach
- Documentation quality

### RBA (Result/Bias Analysis)
- Result interpretation accuracy
- Bias identification
- Limitation acknowledgment
- Sensitivity analysis

## Test Cases

```yaml
test_cases:
  - id: TC-001
    name: minimal-routing
    file: tests/fixtures/minimal.md
    expected_outputs:
      - .planning/memory/problem-analysis.md
      - .planning/memory/dag.json
      - .planning/memory/model-1.md
      - .planning/output/report.tex
    timeout: 600  # 10 minutes

  - id: TC-002
    name: optimization-problem
    file: tests/fixtures/optimization.md  # TODO: create
    expected_outputs:
      - .planning/memory/problem-analysis.md
      - .planning/memory/model-*.md
      - .planning/output/report.pdf
    timeout: 900

  - id: TC-003
    name: prediction-problem
    file: tests/fixtures/prediction.md  # TODO: create
    expected_outputs:
      - .planning/memory/model-*.md
      - .planning/output/figures/*.png
      - .planning/output/report.pdf
    timeout: 1200
```

## Scoring Thresholds

| Grade | Overall Score | Interpretation |
|-------|---------------|----------------|
| A | >= 85 | Ready for competition |
| B | >= 70 | Minor improvements needed |
| C | >= 55 | Significant improvements needed |
| D | < 55 | Requires major rework |

## Execution

```bash
# Run validation
python tests/mmbench_validate.py --config tests/mmbench-validation.yaml

# Generate report
python tests/mmbench_validate.py --report
```